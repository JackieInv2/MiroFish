services:
  - type: web
    name: btrate-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements-debate.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 "app:create_app()"
    plan: free
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.0
